## Exception / Waiver Registry
##
## Each entry documents a justified deviation from a KSI policy.
## Exceptions are time-bound and must include a rationale, approver, and expiration.
## The persistent validation pipeline reads this file and skips matching resources.
## Expired exceptions are flagged as violations.
##
## Schema:
##   - resource: Terraform resource address (e.g., module.vpc.aws_security_group.public)
##     ksi: KSI code (e.g., KSI-CNA-RNT)
##     policy: Rego package (e.g., cna.restricting_network_traffic)
##     rationale: Why this exception is justified
##     approved_by: Name or role of the approver
##     granted: Date the exception was granted (YYYY-MM-DD)
##     expires: Date the exception expires (YYYY-MM-DD)
##     ticket: Link to tracking ticket

exceptions: []

